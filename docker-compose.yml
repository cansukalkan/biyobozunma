services:
  bozunma-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bozunma-analizi:1.0.0
    container_name: bozunma_analizi_app
    restart: unless-stopped
    ports:
      # Güvenlik Kuralı: Dış dünyaya açılmaz, yalnızca yerel localhost'a bağlanır
      - "127.0.0.1:8765:8765"
    environment:
      - BOZUNMA_ENV=production
      - BOZUNMA_API_TOKEN=${BOZUNMA_API_TOKEN:-bozunma-secret-2026}
      - BOZUNMA_RESULTS_DIR=/app/runs/web_results
    volumes:
      # Analiz sonuçlarının kalıcılığı için ayrılmış hacim
      - web_results:/app/runs/web_results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  web_results:
    name: bozunma_web_results
